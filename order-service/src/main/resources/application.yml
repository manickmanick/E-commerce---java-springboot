spring:
  application:
    name: order-service
  cloud:
    openFeign:
      client:
        config:
          user-service:
            connect-timeout: 1000
            read-timeout: 3000

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_order_db
    username: root
    password: Manick@123

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8083

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-type: count_based
        sliding-window-size: 5
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 25s